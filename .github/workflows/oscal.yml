name: oscal

# Rebuild the OSCAL artifacts from their committed sources, validate every document
# with oscal-cli, and fail if anything differs from what is committed. Weekly, also
# re-fetch the two CCCS PDFs and fail if either no longer matches its pinned SHA-256,
# which is how a silent revision of the rulebook shows up.

on:
  push:
    branches: [main]
    paths: ["oscal/**", "itsg33-kubernetes-mapping.csv", ".github/workflows/oscal.yml"]
  pull_request:
    paths: ["oscal/**", "itsg33-kubernetes-mapping.csv", ".github/workflows/oscal.yml"]
  schedule:
    - cron: "23 13 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  OSCAL_CLI_VERSION: "3.2.0"
  OSCAL_CLI_SHA256: "e001b353ee245da6f4ff0ad930c4dfaa88083c63243ca004bd5f5bcef44e8ec8"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Install oscal-cli
        run: |
          url="https://repo1.maven.org/maven2/dev/metaschema/oscal/oscal-cli-enhanced/${OSCAL_CLI_VERSION}/oscal-cli-enhanced-${OSCAL_CLI_VERSION}-oscal-cli.zip"
          curl -fsSL -o "$RUNNER_TEMP/oscal-cli.zip" "$url"
          echo "${OSCAL_CLI_SHA256}  $RUNNER_TEMP/oscal-cli.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/oscal-cli.zip" -d "$RUNNER_TEMP/oscal-cli"
          echo "$RUNNER_TEMP/oscal-cli/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-go@v6
        with:
          go-version: "1.24"
      - name: Install Kyverno CLI and c2pcli
        run: oscal/policy/scripts/install-tools.sh
      - name: Build and validate
        run: oscal/scripts/build.sh
      - name: Fail on drift
        # Untracked files count: git diff alone would miss a newly generated file.
        run: |
          git status --porcelain
          git diff --stat
          test -z "$(git status --porcelain)"

  sources:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Check CCCS PDFs against their pins
        run: oscal/scripts/fetch.sh --pdfs
