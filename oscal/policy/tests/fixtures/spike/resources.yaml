apiVersion: v1
kind: Pod
metadata:
  name: privileged
  namespace: spike
spec:
  containers:
    - name: app
      image: registry.example.ca/app:1.0.0
      securityContext:
        privileged: true
---
apiVersion: v1
kind: Pod
metadata:
  name: unprivileged
  namespace: spike
spec:
  containers:
    - name: app
      image: registry.example.ca/app:1.0.0
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: masters
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: system:masters
